<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RuralCare Connect - On-Demand Rural Healthcare Visits</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>" />
</head>
<body>

  <!-- Top Demo Control Bar (For Judges & Presenters) -->
  <header class="demo-bar">
    <div class="brand-section">
      <span class="brand-badge">RURALCARE</span>
      <h1 class="app-title">
        <span>🏥</span>
        <span data-i18n="appName">RuralCare Connect</span>
      </h1>
    </div>

    <!-- View Mode Switcher -->
    <nav class="demo-tabs">
      <button class="tab-btn active" data-view="dual" onclick="window.App.setView('dual')">
        <span>📲</span>
        <span data-i18n="dualMode">Dual Device Demo (Live Sync)</span>
      </button>
      <button class="tab-btn" data-view="patient" onclick="window.App.setView('patient')">
        <span>📱</span>
        <span data-i18n="patientApp">Patient App</span>
      </button>
      <button class="tab-btn" data-view="doctor" onclick="window.App.setView('doctor')">
        <span>🩺</span>
        <span data-i18n="doctorApp">Doctor / ASHA App</span>
      </button>
      <button class="tab-btn" data-view="admin" onclick="window.App.setView('admin')">
        <span>🏛️</span>
        <span data-i18n="govDashboard">Government Dashboard</span>
      </button>
    </nav>

    <!-- Language & Simulation Controls -->
    <div class="demo-actions">
      <!-- Multilingual Selector -->
      <select class="lang-select" onchange="window.RURAL_I18N.setLang(this.value)">
        <option value="en">🌐 English</option>
        <option value="hi">🌐 हिन्दी (Hindi)</option>
        <option value="bn">🌐 বাংলা (Bengali)</option>
        <option value="ta">🌐 தமிழ் (Tamil)</option>
        <option value="te">🌐 తెలుగు (Telugu)</option>
        <option value="mr">🌐 मराठी (Marathi)</option>
      </select>

      <!-- Offline Simulator Toggle -->
      <button class="offline-toggle-btn" id="offline-toggle-btn" onclick="window.AppState.toggleOfflineSimulation()">
        <span>📶</span>
        <span>Simulate Offline</span>
      </button>

      <!-- Speed Mode Toggle -->
      <button class="tab-btn" id="speed-toggle-btn" style="background: #0284c7; color: white;" onclick="window.App.toggleSpeed()" title="Change simulation movement speed">
        <span>⚡</span>
        <span id="speed-label">Speed: 3x Turbo</span>
      </button>

      <!-- 1-Click Complete Flow Walkthrough -->
      <button class="tab-btn" style="background: #059669; color: white;" onclick="window.App.runFastDemoWalkthrough()" title="Auto-run full flow in 8 seconds">
        <span>▶️</span>
        <span>Auto-Demo (8s)</span>
      </button>

      <!-- Reset Demo State -->
      <button class="reset-btn" onclick="window.App.handleResetDemo()" title="Reset all data to seeds">
        ↺ Reset
      </button>
    </div>
  </header>

  <!-- Offline-First Intent Indicator Banner -->
  <div class="offline-banner" id="offline-banner" style="display: none;">
    <span>📶</span>
    <span data-i18n="offlineActive">
      Offline-First Mode Active • 2 records cached locally. Syncs when 2G/4G returns.
    </span>
  </div>

  <!-- Master Stage Container -->
  <main class="stage-container" id="stage-container">
    <!-- Viewports are dynamically injected by window.App.render() -->
  </main>

  <!-- JavaScript Modules -->
  <script src="/js/i18n.js"></script>
  <script src="/js/sounds.js"></script>
  <script src="/js/village-map.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/sos-flow.js"></script>
  <script src="/js/patient-view.js"></script>
  <script src="/js/doctor-view.js"></script>
  <script src="/js/admin-view.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
